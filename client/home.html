<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Spellcasters - Home</title>
  <link rel="icon" href="data:,"> <!-- sostituita da js/ui/favicon.js con un cerchio magico -->
  <link rel="stylesheet" href="/css/style-base.css">
  <link rel="stylesheet" href="/css/style-buttons.css">
  <link rel="stylesheet" href="/css/style-home.css">
  <link rel="stylesheet" href="/css/style-modal.css">
  <link rel="stylesheet" href="/css/style-expbar.css">
  <link rel="stylesheet" href="/css/style-motion.css">
  <!-- Tema già al primo disegno: niente lampo chiaro di notte, e il velo di transizione ha il colore giusto -->
  <script>document.documentElement.dataset.theme = localStorage.getItem('colorMode') === 'night' ? 'night' : 'day';</script>
</head>
<body>
  <div id="home-container" class="centered">
    <h1 id="home-title">Spellcasters</h1>
    <div id="home-buttons">
      <button id="btn-lab" class="main-btn home-btn-long">Lab</button>
      <button id="btn-arena" class="main-btn home-btn-long">Arena</button>
      <button id="btn-shop" class="main-btn home-btn-long">Shop</button>
      <button id="btn-settings" class="main-btn home-btn-long">Impostazioni</button>
    </div>
    <div id="home-bottom-buttons">
      <button id="logout-btn" class="main-btn home-btn-bottom">Log out</button>
      <button id="btn-player-info" class="main-btn home-btn-bottom">Info Player</button>
    </div>
  </div>
  <div id="settings-modal" class="modal hidden">
    <div class="modal-content settings-large">
      <h2>Impostazioni</h2>
      <div class="settings-sliders">
        <label>Numero particelle:
          <input type="range" id="particle-count" min="20" max="200" value="60">
          <span id="particle-count-value">60</span>
        </label>
        <label>Audio:
          <input type="range" id="audio-volume" min="0" max="100" value="50">
          <span id="audio-volume-value">50%</span>
        </label>
      </div>
      <div id="theme-toggle-container" class="settings-row">
        <span class="settings-option-label">Tema colore:</span>
      </div>
      <div class="settings-option">
        <span class="settings-option-label">Indicatore della carica selezionata nel cerchio:</span>
        <div id="charge-indicator-options" class="segmented" role="radiogroup" aria-label="Indicatore della carica selezionata">
          <button type="button" role="radio" data-value="none">Nessuno</button>
          <button type="button" role="radio" data-value="particles">Particelle</button>
          <button type="button" role="radio" data-value="reticle">Mirino</button>
          <button type="button" role="radio" data-value="both">Entrambi</button>
        </div>
      </div>

      <label style="font-size:1.15em;">Key Bindings (clicca un tasto per cambiarlo):</label>
      <div class="keybindings-list">
        <!-- Le righe dei tasti rimappabili sono generate da home.page.js -->
        <div id="keybindings-custom" class="keybindings-list"></div>
        <div class="keybinding-row"><span class="keybinding-label">Annulla cerchio magico / magia attiva</span><span class="key">RMB</span></div>
        <div class="keybinding-row"><span class="keybinding-label">Cambia la carica del cerchio da lanciare</span><span class="key">Rotella</span></div>
        <button type="button" id="reset-keybindings" class="keybindings-reset">Ripristina predefiniti</button>
      </div>
      <button id="close-settings" class="main-btn" style="margin-top:24px;">Chiudi</button>
    </div>
  </div>
  <button id="version">Version</button>
  <canvas id="home-fog-canvas"></canvas>
  <script type="module" src="./js/pages/home.page.js"></script>
</body>
</html>
