<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="/css/style-base.css" />
  <link rel="stylesheet" href="/css/style-buttons.css" />
  <link rel="stylesheet" href="/css/style-home.css" />
  <link rel="stylesheet" href="/css/style-modal.css" />
  <link rel="stylesheet" href="/css/style-expbar.css" />
  <title>Spellcaster - Login</title>
  <link rel="icon" href="data:,"> <!-- sostituita da js/ui/favicon.js con un cerchio magico -->
  <style>
    #login-form, #signup-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: min(340px, 92vw);
      padding: 30px 30px 26px;
    }
    #login-form input, #signup-form input {
      width: 100%;
      margin-bottom: 6px;
    }
    #login-form button, #signup-form button {
      margin-top: 6px;
      width: 100%;
    }
    #switch-link,
    #switch-link2 {
      align-self: center;
      margin-top: 6px;
      color: var(--accent-text);
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    #login-error, #signup-error {
      color: var(--danger);
      font-size: 0.95rem;
      font-weight: 600;
      min-height: 1.2em;
    }
  </style>
  <link rel="stylesheet" href="/css/style-motion.css">
  <!-- Tema già al primo disegno: niente lampo chiaro di notte, e il velo di transizione ha il colore giusto -->
  <script>document.documentElement.dataset.theme = localStorage.getItem('colorMode') === 'night' ? 'night' : 'day';</script>
</head>
<body>
  <div id="login-container">
    <h1 id="home-title">Spellcasters</h1>
    <form id="login-form">
      <label for="login-username" class="login-label">Nome utente</label>
      <input id="login-username" type="text" required autocomplete="username">
      <label for="login-password" class="login-label">Password</label>
      <input id="login-password" type="password" required autocomplete="current-password">
      <div id="login-error"></div>
      <button type="submit">Login</button>
      <span id="switch-link">Non hai un account? Registrati</span>
    </form>
    <form id="signup-form" style="display:none;">
      <label for="signup-username" class="login-label">Nome utente</label>
      <input id="signup-username" type="text" required autocomplete="username">
      <label for="signup-password" class="login-label">Password</label>
      <input id="signup-password" type="password" required autocomplete="new-password">
      <div id="signup-error"></div>
      <button type="submit">Registrati</button>
      <span id="switch-link2">Hai già un account? Login</span>
    </form>
  </div>
  <script type="module" src="./js/pages/login.page.js"></script>
</body>
</html>
