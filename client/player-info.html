<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Info Giocatore - Spellcasters</title>
  <link rel="icon" href="data:,"> <!-- sostituita da js/ui/favicon.js con un cerchio magico -->
  <link rel="stylesheet" href="/css/style-base.css">
  <link rel="stylesheet" href="/css/style-buttons.css">
  <link rel="stylesheet" href="/css/style-home.css">
  <link rel="stylesheet" href="/css/style-modal.css">
  <link rel="stylesheet" href="/css/style-expbar.css">
  <!-- Rune del nome nel cerchio dei Linker (su Windows c'è anche Segoe UI Historic come riserva) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Runic&display=swap">
  <style>
    /* --- Tre viste affiancate (come Arena/Classifica): Linker a sinistra, info al centro, statistiche a destra --- */
    #main-view-wrapper {
      display: flex;
      width: 300vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      transform: translateX(-100vw);
      transition: transform 0.5s ease-in-out;
    }
    body.show-stats #main-view-wrapper { transform: translateX(-200vw); }
    body.show-linker #main-view-wrapper { transform: translateX(0); }
    /* Dalle info si apre una delle due viste laterali; da lì si torna solo alle info */
    body:is(.show-stats, .show-linker) :is(#open-stats-btn, #open-linker-btn),
    body:not(.show-stats) #close-stats-btn,
    body:not(.show-linker) #close-linker-btn { display: none; }

    #linker-panel, #player-info-container, #stats-panel {
      width: 100vw;
      height: 100vh;
      flex-shrink: 0;
      overflow-y: auto;
    }

    /* --- Scheda info --- */
    #player-info-container {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 64px 32px 24px;
    }
    #player-info-card {
      --cut: 18px;
      width: min(460px, 100%);
      max-height: calc(100vh - 64px);
      overflow-y: auto;
      padding: 30px 32px 28px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 2px;
    }
    #player-info-card h2 {
      font-size: 1.6rem;
      margin-bottom: 16px;
    }
    .player-info-row {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding: 7px 2px;
      border-bottom: 1px dashed var(--line);
    }
    .player-info-label {
      color: var(--text-muted);
      font-weight: 600;
    }
    .player-info-value {
      color: var(--text);
      font-weight: 700;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .player-info-graph-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 22px;
    }
    .player-info-graph-section h3 {
      align-self: stretch;
      font-size: 0.85rem;
      letter-spacing: 0.14em;
      color: var(--accent-2-text);
      padding-bottom: 6px;
      margin: 12px 0 8px;
      border-bottom: 1px solid var(--line);
    }
    .player-info-graph-section canvas {
      display: block;
      max-width: 100%;
    }
    #back-home-btn {
      align-self: center;
      margin-top: 22px;
      min-width: 220px;
    }

    /* --- Pannello statistiche --- */
    #stats-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 72px 48px 24px;
    }
    #stats-panel h2 {
      font-size: 1.6rem;
      width: min(640px, 100%);
      margin-bottom: 10px;
    }
    #skill-points {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      padding: 6px 14px;
      border: 1px solid var(--line-strong);
      background: var(--surface);
      font-weight: 600;
      color: var(--text-muted);
    }
    #skill-points-value {
      min-width: 1.6em;
      padding: 0 6px;
      text-align: center;
      font-weight: 800;
      color: var(--on-accent);
      background: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .stats-list {
      list-style: none;
      width: min(640px, 100%);
      border: 1px solid var(--line-strong);
      background: var(--surface);
    }
    .stats-list li {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 46px;
      padding: 6px 14px;
      border-bottom: 1px solid var(--line);
    }
    .stats-list li:last-child { border-bottom: none; }
    .stats-list li.stats-divider {
      min-height: 0;
      height: 8px;
      padding: 0;
      background: var(--surface-2);
    }
    .stat-label {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      color: var(--text);
    }
    /* Pad colorato dell'elemento: il colore non va sul testo, che resta leggibile */
    .stat-label.element::before {
      content: '';
      width: 9px;
      height: 9px;
      flex-shrink: 0;
      background: var(--el);
      rotate: 45deg;
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--text) 25%, transparent);
    }
    .stat-value {
      font-weight: 800;
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }
    .stat-preview {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      color: var(--success);
    }
    .stat-btn {
      --cut: 6px;
      width: 32px;
      height: 32px;
      padding: 0;
      flex-shrink: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0;
      color: var(--accent-text);
    }
    .stat-btn.info {
      --cut: 4px;
      width: 22px;
      height: 22px;
      font-family: Georgia, 'Segoe UI', serif;
      font-style: italic;
      font-size: 0.85rem;
    }
    .stat-btn-spacer { width: 32px; flex-shrink: 0; }
    .stats-list li.stat-info {
      display: block;
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--text);
      background: var(--tint);
      box-shadow: inset 3px 0 0 var(--accent);
    }
    #stats-error {
      min-height: 1.2em;
      margin-top: 12px;
      color: var(--danger);
      font-weight: 600;
    }

    /* --- Pannello Linker: come quello delle statistiche, ma con la linguetta a sinistra --- */
    #linker-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px 48px 72px;
    }
    #linker-panel h2 {
      font-size: 1.6rem;
      width: min(860px, 100%);
      margin-bottom: 10px;
    }
    /* Stesso riquadro dei punti abilità: qui contiene il colore del cerchio e l'alfabeto runico */
    .linker-options {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
    }
    .linker-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 8px 6px 14px;
      border: 1px solid var(--line-strong);
      background: var(--surface);
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }
    .linker-option:has(:disabled) { cursor: default; }
    #linker-alphabet:focus-visible { outline: none; border-color: var(--accent); }
    #linker-color {
      width: 44px;
      height: 26px;
      padding: 0;
      border: 1px solid var(--line-strong);
      background: none;
      cursor: inherit;
    }
    #linker-color::-webkit-color-swatch-wrapper { padding: 2px; }
    #linker-color::-webkit-color-swatch { border: none; }
    #linker-color::-moz-color-swatch { border: none; }
    #linker-color-value {
      min-width: 5.5em;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--accent-text);
      text-transform: uppercase;
      font-variant-numeric: tabular-nums;
    }
    .linker-layout {
      --chip-w: 76px;
      display: grid;
      /* Colonna del cerchio a larghezza fissa: con minmax() la griglia la ricalcolava sul contenuto
         e, mentre la lista si restringeva, il cerchio rimpiccioliva */
      grid-template-columns: 380px minmax(0, 1fr);
      grid-template-areas: "circle slots";
      align-items: center;
      gap: 28px;
      width: min(860px, 100%);
    }
    #linker-circle {
      grid-area: circle;
      justify-self: center;
      display: block;
      width: 380px;
      max-width: 100%;
      aspect-ratio: 1;
    }
    #linker-slots {
      grid-area: slots;
      width: 100%;
      justify-self: start;
      /* la larghezza si anima da linker-inspector.js (in pixel misurati) */
    }
    #linker-slots li {
      overflow: hidden;
      white-space: nowrap;
      cursor: pointer;
      transition: padding 0.38s, gap 0.38s, background-color 0.2s, box-shadow 0.2s, color 0.2s;
    }
    #linker-slots .stat-value { transition: opacity 0.15s; }

    /* Fase 1: la lista si restringe orizzontalmente sul posto (rimangono solo i nomi degli slot) */
    .linker-layout.compacting #linker-slots { width: var(--chip-w); }
    .linker-layout.compacting #linker-slots li {
      justify-content: center;
      gap: 0;
      padding: 6px 4px;
    }
    .linker-layout.compacting #linker-slots .stat-value { opacity: 0; width: 0; }
    .linker-layout.compacting .stat-label.linker-slot { flex: 0 0 auto; font-size: 0.8rem; }
    .linker-layout.compacting .stat-label.linker-slot::before { display: none; }

    /* Fasi 2-3: le voci sono in fila sotto il cerchio (schede degli slot), a destra l'inventario */
    .linker-layout.inspecting {
      width: min(1160px, 100%);
      grid-template-columns: 400px minmax(0, 1fr); /* 5 schede da 76 px + 4 spazi da 5 px */
      grid-template-areas: "circle inventory" "slots inventory";
      align-items: start;
      row-gap: 14px;
    }
    .linker-layout.inspecting #linker-slots {
      display: flex;
      justify-self: center;
      gap: 5px;
      width: auto;
      border: none;
      background: none;
    }
    .linker-layout.inspecting #linker-slots li {
      width: var(--chip-w);
      border: 1px solid var(--line-strong);
      background: var(--surface);
    }
    #linker-slots li.selected {
      color: var(--accent-text);
      background: color-mix(in srgb, var(--linker-color, var(--accent)) 14%, var(--surface));
      box-shadow: inset 0 -3px 0 var(--linker-color, var(--accent));
    }
    #linker-slots li.hover:not(.selected) { background: var(--tint); }

    /* --- Inventario dei Linker dello slot (griglia + dettaglio, come gli artefatti di Genshin) --- */
    #linker-inventory {
      grid-area: inventory;
      align-self: stretch;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 420px;
      padding: 16px 18px;
      opacity: 0;
      translate: 28px 0;
      transition: opacity 0.32s ease, translate 0.32s cubic-bezier(.16, 1, .3, 1);
    }
    #linker-inventory.visible { opacity: 1; translate: 0 0; }
    /* display: flex qui sopra scavalcherebbe l'attributo hidden: chiuso non deve occupare la griglia */
    #linker-inventory[hidden] { display: none; }
    .linker-inventory-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }
    .linker-inventory-header h3 {
      margin: 0;
      font-size: 1.15rem;
      color: var(--accent-text);
    }
    .linker-inventory-count {
      min-width: 1.6em;
      padding: 0 6px;
      text-align: center;
      font-weight: 800;
      color: var(--on-accent);
      background: var(--accent);
      font-variant-numeric: tabular-nums;
    }
    .linker-inventory-sort {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .linker-inventory-sort select,
    #linker-alphabet {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--accent-text);
      padding: 3px 6px;
      border: 1px solid var(--line-strong);
      border-radius: 0;
      background: var(--surface-2);
      cursor: pointer;
    }
    .linker-close {
      --cut: 6px;
      width: 32px;
      height: 32px;
      padding: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 1rem;
      letter-spacing: 0;
    }
    .linker-inventory-body {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
      gap: 16px;
      min-height: 0;
    }
    .linker-grid {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
      align-content: start;
      gap: 8px;
      max-height: 460px;
      overflow-y: auto;
    }
    .linker-grid-empty {
      grid-column: 1 / -1;
      padding: 18px 14px;
      border: 1px dashed var(--line-strong);
      color: var(--text-muted);
      text-align: center;
    }
    .linker-card {
      --rarity: var(--line-strong);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 18px 6px 8px;
      border: 1px solid var(--line-strong);
      border-bottom: 3px solid var(--rarity);
      background: var(--surface-2);
      cursor: pointer;
      text-align: center;
    }
    .linker-card.rarity-3 { --rarity: #4a9eff; }
    .linker-card.rarity-4 { --rarity: #a86bff; }
    .linker-card.rarity-5 { --rarity: var(--gold); }
    .linker-card.picked { outline: 2px solid var(--linker-color, var(--accent)); outline-offset: 1px; }
    .linker-card-level { position: absolute; top: 3px; left: 6px; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); }
    .linker-card-name { font-weight: 700; font-size: 0.85rem; }
    .linker-card-stars, .linker-detail-stars { color: var(--gold); letter-spacing: 1px; }
    .linker-card-equipped {
      position: absolute;
      top: 3px;
      right: 4px;
      width: 8px;
      height: 8px;
      background: var(--linker-color, var(--accent));
      rotate: 45deg;
      font-size: 0;
    }
    .linker-detail {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 14px;
      border: 1px solid var(--line);
      background: var(--tint);
      box-shadow: inset 3px 0 0 var(--linker-color, var(--accent));
    }
    .linker-detail-title { margin: 0; font-size: 1.05rem; }
    .linker-detail-meta, .linker-detail-empty { margin: 0; color: var(--text-muted); }
    .linker-detail-stars { margin: 0; }
    .linker-detail-stats { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    .linker-stat { display: flex; justify-content: space-between; padding: 6px 2px; border-bottom: 1px dashed var(--line); }
    .linker-stat.main { font-weight: 800; font-size: 1.05rem; }
    .linker-stat-value { font-variant-numeric: tabular-nums; font-weight: 700; }
    .linker-detail-badge { margin: 0; font-weight: 700; color: var(--linker-color, var(--accent-text)); }
    .linker-detail-actions { margin-top: auto; display: flex; gap: 8px; }
    .linker-action { flex: 1; padding: 0.6em 1em; font-size: 0.9rem; }
    .linker-action.primary { --edge: var(--accent); --fill: var(--accent); color: var(--on-accent); }
    /* Pad dello slot: un piccolo anello del colore del cerchio */
    .stat-label.linker-slot::before {
      content: '';
      width: 10px;
      height: 10px;
      flex-shrink: 0;
      border: 2px solid var(--linker-color, var(--accent));
      border-radius: 50%;
    }
    .stats-list li.linker-row { transition: background-color 0.2s, box-shadow 0.2s; }
    .stats-list li.linker-row:hover {
      background: var(--tint);
      box-shadow: inset 3px 0 0 var(--linker-color, var(--accent));
    }
    .stat-value.empty {
      font-weight: 600;
      color: var(--text-muted);
    }
    #linker-error {
      min-height: 1.2em;
      margin-top: 12px;
      color: var(--danger);
      font-weight: 600;
    }

    @media (max-width: 800px) {
      .linker-layout,
      .linker-layout.inspecting {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas: "circle" "slots" "inventory";
        justify-items: center;
      }
      #linker-circle { width: min(360px, 100%); }
      #linker-inventory { justify-self: stretch; }
      .linker-inventory-body { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 600px) {
      #player-info-container, #stats-panel { padding-left: 12px; padding-right: 56px; }
      #linker-panel { padding-left: 56px; padding-right: 12px; }
      #player-info-card { padding: 22px 18px; }
    }
  </style>
  <link rel="stylesheet" href="/css/style-motion.css">
  <!-- Tema già al primo disegno: niente lampo chiaro di notte, e il velo di transizione ha il colore giusto -->
  <script>document.documentElement.dataset.theme = localStorage.getItem('colorMode') === 'night' ? 'night' : 'day';</script>
</head>
<body>
  <button id="open-linker-btn" class="slide-btn left">Linker</button>
  <button id="close-linker-btn" class="slide-btn left">Info Giocatore</button>
  <button id="open-stats-btn" class="slide-btn">Statistiche</button>
  <button id="close-stats-btn" class="slide-btn">Info Giocatore</button>

  <div id="main-view-wrapper">
  <div id="linker-panel">
    <h2 class="section-title">Linker</h2>
    <div class="linker-options">
      <label id="linker-color-field" class="linker-option">Colore del cerchio:
        <input type="color" id="linker-color">
        <span id="linker-color-value"></span>
      </label>
      <label class="linker-option">Rune:
        <select id="linker-alphabet"></select>
      </label>
    </div>
    <div class="linker-layout">
      <canvas id="linker-circle" width="380" height="380" aria-label="Cerchio dei Linker: clicca uno slot per aprirlo"></canvas>
      <ul id="linker-slots" class="stats-list" role="tablist" aria-label="Slot dei Linker"></ul>
      <section id="linker-inventory" class="panel" hidden>
        <header class="linker-inventory-header">
          <h3 data-role="title"></h3>
          <span class="linker-inventory-count" data-role="count" title="Linker posseduti per questo slot">0</span>
          <label class="linker-inventory-sort">Ordina:
            <select data-role="sort">
              <option value="rarita">Rarità</option>
              <option value="livello">Livello</option>
            </select>
          </label>
          <button type="button" class="linker-close" data-role="close" title="Chiudi (Esc)" aria-label="Chiudi">✕</button>
        </header>
        <div class="linker-inventory-body">
          <ul class="linker-grid" data-role="grid"></ul>
          <aside class="linker-detail" data-role="detail"></aside>
        </div>
      </section>
    </div>
    <p id="linker-error"></p>
  </div>

  <div id="player-info-container">
    <div id="player-info-card">
      <h2>Info Giocatore</h2>
      <div class="player-info-row"><span class="player-info-label">Username:</span><span class="player-info-value" id="info-username"></span></div>
      <div class="player-info-row"><span class="player-info-label">Livello:</span><span class="player-info-value" id="info-level"></span></div>
      <div class="player-info-row"><span class="player-info-label">Esperienza:</span><span class="player-info-value" id="info-exp"></span></div>
      <div class="player-info-row"><span class="player-info-label">Mana:</span><span class="player-info-value" id="info-mana"></span></div>
      <div class="player-info-row"><span class="player-info-label">Vittorie:</span><span class="player-info-value" id="info-vittorie"></span></div>
      <div class="player-info-row"><span class="player-info-label">Partite:</span><span class="player-info-value" id="info-partite"></span></div>
      <div class="player-info-graph-section">
        <h3>Affinità Elementi</h3>
        <canvas id="affinity-radar" width="340" height="220"></canvas>
        <h3 style="margin:24px 0 8px 0;">Predisposizione Proiezioni</h3>
        <canvas id="predisposition-radar" width="340" height="220"></canvas>
      </div>
      <button id="back-home-btn" class="main-btn home-btn-long">Torna alla Home</button>
    </div>
  </div>

  <div id="stats-panel">
    <h2>Statistiche</h2>
    <p id="skill-points">Punti abilità disponibili: <span id="skill-points-value">0</span></p>
    <ul id="stats-list" class="stats-list"></ul>
    <p id="stats-error"></p>
  </div>
  </div>
  <script type="module" src="./js/pages/player-info.page.js"></script>
</body>
</html>
