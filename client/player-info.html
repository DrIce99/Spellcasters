<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Info Giocatore - Spellcasters</title>
  <link rel="stylesheet" href="/css/style-base.css">
  <link rel="stylesheet" href="/css/style-buttons.css">
  <link rel="stylesheet" href="/css/style-home.css">
  <link rel="stylesheet" href="/css/style-modal.css">
  <link rel="stylesheet" href="/css/style-expbar.css">
  <style>
    #player-info-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
    }
    #player-info-card {
      background: rgba(34,34,51,0.92);
      border-radius: 1.2em;
      box-shadow: 0 0 32px #7f5cff44;
      padding: 40px 36px 32px 36px;
      min-width: 320px;
      max-width: 95vw;
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      overflow-y: auto;
      max-height: 90vh;
    }
    #player-info-card h2 {
      font-family: 'Cinzel', serif;
      font-size: 2.1em;
      margin-bottom: 12px;
      color: var(--home-title-color);
    }
    .player-info-row {
      font-size: 1.18em;
      display: flex;
      gap: 18px;
      justify-content: space-between;
      font-family: 'Cinzel';
      width: 100%;
      max-width: 340px;
    }
    .player-info-label {
      font-weight: bold;
      color: #00eaff;
      min-width: 120px;
    }
    .player-info-value {
      color: #fff;
      text-align: right;
      flex: 1;
    }
    #back-home-btn {
      margin-top: 32px;
      min-width: 180px;
      min-height: 48px;
      font-size: 1.18em;
      line-height: 1.2;
    }
    .player-info-graph-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 400px;
      margin: 32px 0 0 0;
    }
    .player-info-graph-section h3 {
      font-family: 'Cinzel';
      color: var(--home-title-color);
      font-size: 1.2em;
      margin-bottom: 8px;
      text-align: center;
    }
    .player-info-graph-section canvas {
      display: block;
      margin: 0 auto 24px auto;
    }
    /* Scrollbar custom */
    #player-info-card::-webkit-scrollbar {
      width: 12px;
      background: rgba(127,92,255,0.08);
      border-radius: 8px;
    }
    #player-info-card::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #00eaff 0%, #7f5cff 100%);
    }
    #player-info-card {
      scrollbar-width: thin;
      scrollbar-color: #7f5cff #23233a;
    }
    /* --- Due viste affiancate (come Arena/Classifica): info a sinistra, statistiche a destra --- */
    body { overflow: hidden; }
    #main-view-wrapper {
      display: flex;
      width: 200vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      transition: transform 0.5s ease-in-out;
    }
    body.show-stats #main-view-wrapper { transform: translateX(-100vw); }
    #player-info-container, #stats-panel {
      width: 100vw;
      height: 100vh;
      box-sizing: border-box;
      flex-shrink: 0;
    }
    #stats-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
      padding: 48px 64px;
      color: var(--text-color);
    }
    #stats-panel h2 {
      font-family: 'Cinzel', serif;
      font-size: 2em;
      color: var(--home-title-color);
      margin: 0 0 8px 0;
    }
    .slide-btn {
      position: fixed;
      z-index: 100;
      top: 50%;
      right: 0;
      transform: translateY(-50%);
      width: 40px;
      height: 220px;
      border: none;
      cursor: pointer;
      color: white;
      font-weight: bold;
      writing-mode: vertical-lr;
      padding: 10px 5px;
      border-radius: 5px 0 0 5px;
      background: linear-gradient(180deg, #7f5cff 0%, #00eaff 100%);
    }
    body.show-stats #open-stats-btn,
    body:not(.show-stats) #close-stats-btn { display: none; }

    /* --- Elenco statistiche --- */
    #skill-points {
      font-family: 'Cinzel';
      font-size: 1.15em;
      margin: 0 0 18px 0;
    }
    #skill-points-value { color: #ffd166; font-weight: bold; }
    .stats-list {
      list-style: none;
      padding: 0;
      margin: 0;
      width: min(640px, 100%);
    }
    .stats-list li {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 44px;
      padding: 6px 14px;
      font-size: 1.05em;
    }
    .stats-list li:nth-child(odd) { background: rgba(127, 92, 255, 0.10); }
    .stats-list li.stats-divider {
      min-height: 0;
      padding: 0;
      height: 10px;
      background: none;
    }
    .stat-label { flex: 1; color: #00eaff; font-family: 'Cinzel'; }
    .stat-value { font-weight: bold; text-align: right; font-variant-numeric: tabular-nums; }
    .stat-preview { font-size: 0.85em; color: #9be59b; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .stat-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid #7f5cff;
      background: rgba(127, 92, 255, 0.25);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }
    .stat-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .stat-btn.info { width: 22px; height: 22px; font-size: 0.8em; font-style: italic; margin-left: 6px; }
    .stat-btn-spacer { width: 30px; flex-shrink: 0; }
    .stats-list li.stat-info {
      display: block;
      font-size: 0.9em;
      color: #cfd3ff;
      background: rgba(0, 234, 255, 0.08);
      line-height: 1.6;
    }
    .stats-list li.stat-margins { flex-wrap: wrap; }
    .stat-margins-values { display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: flex-end; }
    #stats-error { color: #ff6b6b; min-height: 1.2em; margin-top: 12px; }

    @media (max-width: 500px) {
      #stats-panel { padding: 24px 16px; }
      #player-info-card {
        min-width: 0;
        padding: 18px 2vw 18px 2vw;
        max-width: 99vw;
      }
      .player-info-graph-section {
        max-width: 99vw;
      }
    }
  </style>
</head>
<body>
  <button id="open-stats-btn" class="slide-btn">Statistiche</button>
  <button id="close-stats-btn" class="slide-btn">Info Giocatore</button>

  <div id="main-view-wrapper">
  <div id="player-info-container">
    <div id="player-info-card">
      <h2>Info Giocatore</h2>
      <div class="player-info-row"><span class="player-info-label">Username:</span><span class="player-info-value" id="info-username"></span></div>
      <div class="player-info-row"><span class="player-info-label">Livello:</span><span class="player-info-value" id="info-level"></span></div>
      <div class="player-info-row"><span class="player-info-label">Esperienza:</span><span class="player-info-value" id="info-exp"></span></div>
      <div class="player-info-row"><span class="player-info-label">Mana:</span><span class="player-info-value" id="info-mana"></span></div>
      <div class="player-info-row"><span class="player-info-label">Vittorie:</span><span class="player-info-value" id="info-vittorie"></span></div>
      <div class="player-info-row"><span class="player-info-label">Partite:</span><span class="player-info-value" id="info-partite"></span></div>
      <div class="player-info-graph-section">
        <h3>Affinità Elementi</h3>
        <canvas id="affinity-radar" width="340" height="220"></canvas>
        <h3 style="margin:24px 0 8px 0;">Predisposizione Proiezioni</h3>
        <canvas id="predisposition-radar" width="340" height="220"></canvas>
      </div>
      <button id="back-home-btn" class="main-btn home-btn-long">Torna alla Home</button>
    </div>
  </div>

  <div id="stats-panel">
    <h2>Statistiche</h2>
    <p id="skill-points">Punti abilità disponibili: <span id="skill-points-value">0</span></p>
    <ul id="stats-list" class="stats-list"></ul>
    <p id="stats-error"></p>
  </div>
  </div>
  <script type="module" src="./js/pages/player-info.page.js"></script>
</body>
</html>
