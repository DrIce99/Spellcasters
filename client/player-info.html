<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Info Giocatore - Spellcasters</title>
  <link rel="stylesheet" href="/css/style-base.css">
  <link rel="stylesheet" href="/css/style-buttons.css">
  <link rel="stylesheet" href="/css/style-home.css">
  <link rel="stylesheet" href="/css/style-modal.css">
  <link rel="stylesheet" href="/css/style-expbar.css">
  <style>
    /* --- Due viste affiancate (come Arena/Classifica): info a sinistra, statistiche a destra --- */
    #main-view-wrapper {
      display: flex;
      width: 200vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      transition: transform 0.5s ease-in-out;
    }
    body.show-stats #main-view-wrapper { transform: translateX(-100vw); }
    body.show-stats #open-stats-btn,
    body:not(.show-stats) #close-stats-btn { display: none; }

    #player-info-container, #stats-panel {
      width: 100vw;
      height: 100vh;
      flex-shrink: 0;
      overflow-y: auto;
    }

    /* --- Scheda info --- */
    #player-info-container {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 64px 32px 24px;
    }
    #player-info-card {
      --cut: 18px;
      width: min(460px, 100%);
      max-height: calc(100vh - 64px);
      overflow-y: auto;
      padding: 30px 32px 28px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 2px;
    }
    #player-info-card h2 {
      font-size: 1.6rem;
      margin-bottom: 16px;
    }
    .player-info-row {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding: 7px 2px;
      border-bottom: 1px dashed var(--line);
    }
    .player-info-label {
      color: var(--text-muted);
      font-weight: 600;
    }
    .player-info-value {
      color: var(--text);
      font-weight: 700;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .player-info-graph-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 22px;
    }
    .player-info-graph-section h3 {
      align-self: stretch;
      font-size: 0.85rem;
      letter-spacing: 0.14em;
      color: var(--accent-2-text);
      padding-bottom: 6px;
      margin: 12px 0 8px;
      border-bottom: 1px solid var(--line);
    }
    .player-info-graph-section canvas {
      display: block;
      max-width: 100%;
    }
    #back-home-btn {
      align-self: center;
      margin-top: 22px;
      min-width: 220px;
    }

    /* --- Pannello statistiche --- */
    #stats-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 72px 48px 24px;
    }
    #stats-panel h2 {
      font-size: 1.6rem;
      width: min(640px, 100%);
      margin-bottom: 10px;
    }
    #skill-points {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      padding: 6px 14px;
      border: 1px solid var(--line-strong);
      background: var(--surface);
      font-weight: 600;
      color: var(--text-muted);
    }
    #skill-points-value {
      min-width: 1.6em;
      padding: 0 6px;
      text-align: center;
      font-weight: 800;
      color: var(--on-accent);
      background: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .stats-list {
      list-style: none;
      width: min(640px, 100%);
      border: 1px solid var(--line-strong);
      background: var(--surface);
    }
    .stats-list li {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 46px;
      padding: 6px 14px;
      border-bottom: 1px solid var(--line);
    }
    .stats-list li:last-child { border-bottom: none; }
    .stats-list li.stats-divider {
      min-height: 0;
      height: 8px;
      padding: 0;
      background: var(--surface-2);
    }
    .stat-label {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      color: var(--text);
    }
    /* Pad colorato dell'elemento: il colore non va sul testo, che resta leggibile */
    .stat-label.element::before,
    .stat-element::before {
      content: '';
      width: 9px;
      height: 9px;
      flex-shrink: 0;
      background: var(--el);
      rotate: 45deg;
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--text) 25%, transparent);
    }
    .stat-value {
      font-weight: 800;
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }
    .stat-preview {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      color: var(--success);
    }
    .stat-btn {
      --cut: 6px;
      width: 32px;
      height: 32px;
      padding: 0;
      flex-shrink: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0;
      color: var(--accent-text);
    }
    .stat-btn.info {
      --cut: 4px;
      width: 22px;
      height: 22px;
      font-family: Georgia, 'Segoe UI', serif;
      font-style: italic;
      font-size: 0.85rem;
    }
    .stat-btn-spacer { width: 32px; flex-shrink: 0; }
    .stats-list li.stat-info {
      display: block;
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--text);
      background: var(--tint);
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .stats-list li.stat-margins { flex-wrap: wrap; }
    .stat-margins-values {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 16px;
      justify-content: flex-end;
    }
    .stat-element {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    #stats-error {
      min-height: 1.2em;
      margin-top: 12px;
      color: var(--danger);
      font-weight: 600;
    }

    @media (max-width: 600px) {
      #player-info-container, #stats-panel { padding-left: 12px; padding-right: 56px; }
      #player-info-card { padding: 22px 18px; }
    }
  </style>
  <link rel="stylesheet" href="/css/style-motion.css">
  <!-- Tema già al primo disegno: niente lampo chiaro di notte, e il velo di transizione ha il colore giusto -->
  <script>document.documentElement.dataset.theme = localStorage.getItem('colorMode') === 'night' ? 'night' : 'day';</script>
</head>
<body>
  <button id="open-stats-btn" class="slide-btn">Statistiche</button>
  <button id="close-stats-btn" class="slide-btn">Info Giocatore</button>

  <div id="main-view-wrapper">
  <div id="player-info-container">
    <div id="player-info-card">
      <h2>Info Giocatore</h2>
      <div class="player-info-row"><span class="player-info-label">Username:</span><span class="player-info-value" id="info-username"></span></div>
      <div class="player-info-row"><span class="player-info-label">Livello:</span><span class="player-info-value" id="info-level"></span></div>
      <div class="player-info-row"><span class="player-info-label">Esperienza:</span><span class="player-info-value" id="info-exp"></span></div>
      <div class="player-info-row"><span class="player-info-label">Mana:</span><span class="player-info-value" id="info-mana"></span></div>
      <div class="player-info-row"><span class="player-info-label">Vittorie:</span><span class="player-info-value" id="info-vittorie"></span></div>
      <div class="player-info-row"><span class="player-info-label">Partite:</span><span class="player-info-value" id="info-partite"></span></div>
      <div class="player-info-graph-section">
        <h3>Affinità Elementi</h3>
        <canvas id="affinity-radar" width="340" height="220"></canvas>
        <h3 style="margin:24px 0 8px 0;">Predisposizione Proiezioni</h3>
        <canvas id="predisposition-radar" width="340" height="220"></canvas>
      </div>
      <button id="back-home-btn" class="main-btn home-btn-long">Torna alla Home</button>
    </div>
  </div>

  <div id="stats-panel">
    <h2>Statistiche</h2>
    <p id="skill-points">Punti abilità disponibili: <span id="skill-points-value">0</span></p>
    <ul id="stats-list" class="stats-list"></ul>
    <p id="stats-error"></p>
  </div>
  </div>
  <script type="module" src="./js/pages/player-info.page.js"></script>
</body>
</html>
