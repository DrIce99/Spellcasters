<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Spellcasters - Game</title>
  <link rel="icon" href="data:,"> <!-- sostituita da js/ui/favicon.js con un cerchio magico -->
  <link rel="stylesheet" href="/css/style-base.css">
  <link rel="stylesheet" href="/css/style-buttons.css">
  <link rel="stylesheet" href="/css/style-home.css">
  <link rel="stylesheet" href="/css/style-modal.css">
  <link rel="stylesheet" href="/css/style-expbar.css">
  <link rel="stylesheet" href="/css/style-motion.css">
  <link rel="stylesheet" href="/css/style-spellbook.css">
  <link rel="stylesheet" href="/css/style-quest-toast.css">
  <!-- Tema già al primo disegno: niente lampo chiaro di notte, e il velo di transizione ha il colore giusto -->
  <script>document.documentElement.dataset.theme = localStorage.getItem('colorMode') === 'night' ? 'night' : 'day';</script>
</head>
<body>
  <!-- Overlay del PvP (usati da pvp-manager.js) -->
  <div id="pre-match-overlay" class="game-overlay hidden">
    <div id="ready-container">
      <h2 id="ready-title">Duello Trovato!</h2>
      <p id="ready-message">Clicca per dichiararti pronto alla battaglia</p>
      <button id="ready-btn" class="main-btn">Sono Pronto</button>
    </div>
    <div id="countdown-container" class="hidden">
      <h1 id="countdown-text">3</h1>
    </div>
  </div>

  <div id="post-match-overlay" class="game-overlay hidden">
    <h1 id="match-result-text"></h1>
    <p>Ritorno all'arena...</p>
  </div>

  <canvas id="spellCanvas"></canvas>
  <div id="exp-bar-container">
    <div id="exp-level">1</div>
    <div class="exp-bar-bg">
      <div id="exp-bar"></div>
      <div class="exp-bar-glow"></div>
    </div>
  </div>
  <!-- game.html?mode=training (manichino) oppure game.html?mode=pvp (duello) -->
  <script type="module" src="./js/pages/game.page.js"></script>
</body>
</html>
