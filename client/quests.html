<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spellcasters - Missioni</title>
  <link rel="icon" href="data:,"> <!-- sostituita da js/ui/favicon.js con un cerchio magico -->
  <link rel="stylesheet" href="/css/style-base.css">
  <link rel="stylesheet" href="/css/style-buttons.css">
  <link rel="stylesheet" href="/css/style-quests.css">
  <link rel="stylesheet" href="/css/style-motion.css">
  <!-- Tema già al primo disegno: niente lampo chiaro di notte, e il velo di transizione ha il colore giusto -->
  <script>document.documentElement.dataset.theme = localStorage.getItem('colorMode') === 'night' ? 'night' : 'day';</script>
</head>
<body>
  <button id="home-btn" class="main-btn">Home</button>

  <main id="quests">
    <h1 class="section-title">Missioni</h1>
    <div class="quests-status">
      <p class="quests-wallet">◈ <strong id="quests-bitrune">…</strong> BitRune</p>
      <button type="button" id="quests-shop-btn" class="quests-small-btn">Shop</button>
    </div>
    <p class="quests-note">Le azioni di combattimento contano nelle partite PvP e nel Training (non in Laboratorio).</p>
    <p class="quests-error" id="quests-error" role="alert"></p>
    <div class="quests-columns">
      <section class="quests-period panel" data-period="giornaliere"></section>
      <section class="quests-period panel" data-period="settimanali"></section>
    </div>
  </main>

  <script type="module" src="./js/pages/quests.page.js"></script>
</body>
</html>
